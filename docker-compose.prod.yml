x-backend-environment: &backend-environment
  RUN_AS: prod
  DJANGO_SETTINGS_MODULE: config.settings.prod
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  DB_NAME: ${DB_NAME:?DB_NAME is required}
  DB_USER: ${DB_USER:?DB_USER is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_SSLMODE: ${DB_SSLMODE:-prefer}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS is required}
  FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
  SITE_URL: ${SITE_URL:?SITE_URL is required}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}
  SECURE_COOKIES: ${SECURE_COOKIES:-true}
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@xigmahardware.com}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - marketplace_network_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: &logging
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

  redis:
    image: redis:7-alpine
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data_prod:/data
    networks:
      - marketplace_network_prod
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

  backend:
    build:
      context: ./emarket-backend
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume_prod:/app/staticfiles
      - media_volume_prod:/app/media
    expose:
      - "8000"
    networks:
      - marketplace_network_prod
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "X-Forwarded-Proto: https", "http://localhost:8000/ready/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *logging

  celery_worker:
    build:
      context: ./emarket-backend
      dockerfile: Dockerfile.prod
    restart: always
    command: ["celery", "-A", "config", "worker", "-l", "warning", "--concurrency=8", "--max-tasks-per-child=1000"]
    environment: *backend-environment
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - marketplace_network_prod
    logging: *logging

  celery_beat:
    build:
      context: ./emarket-backend
      dockerfile: Dockerfile.prod
    restart: always
    command: ["celery", "-A", "config", "beat", "-l", "warning", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    environment: *backend-environment
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - marketplace_network_prod
    logging: *logging

  frontend:
    build:
      context: ./xigma-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: always
    environment:
      API_URL: http://backend:8000
      NESHAN_API_KEY: ${NESHAN_API_KEY:?NESHAN_API_KEY is required}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - marketplace_network_prod
    logging: *logging

  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./emarket-nginx/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./emarket-nginx/config/conf.d:/etc/nginx/conf.d:ro
      - static_volume_prod:/var/www/static:ro
      - media_volume_prod:/var/www/media:ro
    networks:
      - marketplace_network_prod
    logging: *logging

networks:
  marketplace_network_prod:
    driver: bridge

volumes:
  postgres_data_prod:
  redis_data_prod:
  static_volume_prod:
  media_volume_prod:
