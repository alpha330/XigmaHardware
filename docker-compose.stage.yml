x-backend-environment: &backend-environment
  RUN_AS: stage
  DJANGO_SETTINGS_MODULE: config.settings.stage
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  DB_NAME: ${DB_NAME:?DB_NAME is required}
  DB_USER: ${DB_USER:?DB_USER is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_SSLMODE: ${DB_SSLMODE:-prefer}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS is required}
  FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
  SITE_URL: ${SITE_URL:?SITE_URL is required}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
  SECURE_COOKIES: ${SECURE_COOKIES:-false}
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data_stage:/var/lib/postgresql/data
    networks:
      - marketplace_network_stage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb"]
    volumes:
      - redis_data_stage:/data
    networks:
      - marketplace_network_stage
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./emarket-backend
      dockerfile: Dockerfile.stage
    restart: unless-stopped
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume_stage:/app/staticfiles
      - media_volume_stage:/app/media
    expose:
      - "8000"
    networks:
      - marketplace_network_stage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  celery_worker:
    build:
      context: ./emarket-backend
      dockerfile: Dockerfile.stage
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=4"]
    environment: *backend-environment
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - marketplace_network_stage

  celery_beat:
    build:
      context: ./emarket-backend
      dockerfile: Dockerfile.stage
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    environment: *backend-environment
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - marketplace_network_stage

  frontend:
    build:
      context: ./xigma-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000
      NESHAN_API_KEY: ${NESHAN_API_KEY:?NESHAN_API_KEY is required}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - marketplace_network_stage

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./emarket-nginx/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./emarket-nginx/config/conf.d:/etc/nginx/conf.d:ro
      - static_volume_stage:/var/www/static:ro
      - media_volume_stage:/var/www/media:ro
    networks:
      - marketplace_network_stage

networks:
  marketplace_network_stage:
    driver: bridge

volumes:
  postgres_data_stage:
  redis_data_stage:
  static_volume_stage:
  media_volume_stage:
