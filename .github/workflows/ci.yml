name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emarket-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: emarket-backend/requirements/*.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements/test.txt
      - name: Validate Django configuration
        run: python manage.py check --settings=config.settings.test
      - name: Check migration state
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Scan backend for high-confidence security issues
        run: bandit -q -r apps -x '*/migrations/*,*/tests/*' -ll
      - name: Run backend tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xigma-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: xigma-frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          API_URL: http://localhost:8000
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configurations
        run: |
          docker compose --env-file .env.example -f docker-compose.stage.yml config --quiet
          docker compose --env-file .env.example -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.test.yml config --quiet
      - name: Build production backend image
        run: docker build -f emarket-backend/Dockerfile.prod emarket-backend
      - name: Build production frontend image
        run: docker build -f xigma-frontend/Dockerfile xigma-frontend
